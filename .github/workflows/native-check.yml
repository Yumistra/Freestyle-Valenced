name: Native build check

# (임시 브랜치) 네이티브 부분을 빌드해서 plugin.jar 를 이 브랜치에 올린다
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    if: "!contains(github.event.head_commit.message, '[jar]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for p in "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"; do "$SDKM" --install "$p" > /dev/null || echo "skip $p"; done
      - run: bash scripts/build-native.sh
      - name: Commit plugin.jar
        run: |
          mkdir -p jar && cp plugins/better-animations/build/plugin.jar jar/
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -f jar/plugin.jar && git commit -m "plugin.jar [jar]" && git push
