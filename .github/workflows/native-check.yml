name: Native build check

# main 이 아닌 브랜치에서 네이티브(Kotlin) 부분이 컴파일되는지 확인하고, 테스트용 plugin.jar 를 올린다 (배포 안 함)
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for p in "platforms;android-36" "platforms;android-37" "build-tools;36.0.0"; do "$SDKM" --install "$p" > /dev/null || echo "skip $p"; done
      - run: |
          for i in 1 2 3; do
            bash scripts/build-native.sh && exit 0
            echo "native build failed (try $i), retrying"
            sleep 20
          done
          exit 1
      # 테스트 zip 에 넣을 수 있게 plugin.jar 를 올려 둔다
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: plugins/*/build/plugin.jar
          retention-days: 7
