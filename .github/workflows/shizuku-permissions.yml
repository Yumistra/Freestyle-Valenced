name: Shizuku Permissions app

# 플러그인이 여는 도우미 앱 (apps/shizuku-permissions) 을 빌드해서 helper-apk 브랜치에 올린다
on:
  push:
    branches-ignore: [helper-apk, test-jars]
    paths:
      - apps/shizuku-permissions/**
      - .github/workflows/shizuku-permissions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: gradle -p apps/shizuku-permissions :app:assembleRelease --stacktrace
      - name: Push APK to helper-apk branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          APK=$(ls apps/shizuku-permissions/app/build/outputs/apk/release/*.apk | head -1)
          OUT=$(mktemp -d)
          cp "$APK" "$OUT/ShizukuPermissions.apk"
          cd "$OUT"
          git init -q && git checkout -q -b helper-apk
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_REF_NAME $SHA" > SOURCE
          git add -A && git commit -qm "Shizuku Permissions from $GITHUB_REF_NAME $SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" helper-apk
