name: Shizuku Permissions app

# 플러그인이 여는 도우미 앱 (apps/shizuku-permissions) 을 빌드해서 helper-apk 브랜치에 올린다
on:
  push:
    branches-ignore: [helper-apk, helper-test, test-jars]
    paths:
      - apps/shizuku-permissions/**
      - .github/workflows/shizuku-permissions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: gradle -p apps/shizuku-permissions :app:assembleRelease --stacktrace
      - name: Push APK to helper-apk branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          APK=$(ls apps/shizuku-permissions/app/build/outputs/apk/release/*.apk | head -1)
          OUT=$(mktemp -d)
          cp "$APK" "$OUT/ShizukuPermissions.apk"
          cd "$OUT"
          git init -q && git checkout -q -b helper-apk
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_REF_NAME $SHA" > SOURCE
          git add -A && git commit -qm "Shizuku Permissions from $GITHUB_REF_NAME $SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" helper-apk

  # 에뮬레이터에서 Shizuku 와 가짜 디스코드로 처음부터 끝까지 써 본다. 결과는 helper-test 브랜치에
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build app and fake Discord
        run: gradle -p apps/shizuku-permissions :app:assembleRelease :testapp:assembleDebug
      - name: Download Shizuku
        run: |
          URL=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/RikkaApps/Shizuku/releases/latest | python3 -c "import sys,json; print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.apk')][0])")
          echo "$URL"
          curl -sL "$URL" -o shizuku.apk
          ls -la shizuku.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/shizuku-permissions/ci/emulator-test.sh "$(ls apps/shizuku-permissions/app/build/outputs/apk/release/*.apk | head -1)" apps/shizuku-permissions/testapp/build/outputs/apk/debug/testapp-debug.apk shizuku.apk "$PWD/test-out"
      - name: Push results to helper-test branch
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          cd test-out 2>/dev/null || exit 0
          git init -q && git checkout -q -b helper-test
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_REF_NAME $SHA" > SOURCE
          git add -A && git commit -qm "Shizuku Permissions test from $GITHUB_REF_NAME $SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" helper-test
      - name: Fail if a check failed
        run: grep -q '^fails: 0$' test-out/result.txt
