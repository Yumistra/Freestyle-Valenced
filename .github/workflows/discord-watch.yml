name: Discord Watch app

# 디스코드가 꺼져 있을 때 지운 메시지를 잡는 앱 (apps/discord-watch) 을 빌드해서 watch-apk 브랜치에 올린다
on:
  push:
    branches-ignore: ['helper-*', test-jars, watch-apk]
    paths:
      - apps/discord-watch/**
      - .github/workflows/discord-watch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: gradle -p apps/discord-watch :app:assembleRelease --stacktrace
      - name: Push APK to watch-apk branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          APK=$(ls apps/discord-watch/app/build/outputs/apk/release/*.apk | head -1)
          OUT=$(mktemp -d)
          cp "$APK" "$OUT/DiscordWatch.apk"
          cd "$OUT"
          git init -q && git checkout -q -b watch-apk
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "$GITHUB_REF_NAME $SHA" > SOURCE
          git add -A && git commit -qm "Discord Watch from $GITHUB_REF_NAME $SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" watch-apk

